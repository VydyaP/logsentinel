[project]
name = "logsentinel"
version = "0.1.0"
description = "A small SOC-style tool: ingest SSH and web logs, detect attacks (YAML rules + Isolation Forest), triage alerts and write incident reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vydya Pandith" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "markdown>=3.5",
    "fpdf2>=2.7.8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.35",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-Markdown",
]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logsentinel", "simulator"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random is fine for a log simulator, not used for crypto
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"simulator/generate.py" = ["E501"]  # long lists of realistic payloads and user agents

[tool.ruff.lint.isort]
known-first-party = ["logsentinel", "simulator", "conftest"]

[tool.mypy]
python_version = "3.11"
packages = ["logsentinel"]
mypy_path = "src"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["logsentinel.api", "logsentinel.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL database (set DATABASE_URL)"]
addopts = "-q"
